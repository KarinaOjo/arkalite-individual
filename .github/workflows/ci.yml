name: CI-ARKA
# el pipeline se dispara solo con cada push y cada pull request
on:
  push:
  pull_request:

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        servicio: [servicio-solicitudes, servicio-notificaciones]
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '26', cache: maven}

      - name: Compilar y PROBAR ${{ matrix.servicio }}
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}

      - name: Login al registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar ${{ matrix.servicio }}
        working-directory: ${{ matrix.servicio }}
        run: |
          IMG="ghcr.io/${{ github.repository }}/${{ matrix.servicio }}:${{ github.sha }}"
          docker build -t "$IMG" .
          docker push "$IMG"